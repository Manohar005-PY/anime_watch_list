apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kage-web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "6"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: "kage-cloudrun-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO}/kage-frontend:${IMAGE_TAG}"
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "/api/v1"
            - name: BACKEND_INTERNAL_URL
              value: "https://kage-api-${GCP_PROJECT_ID}.a.run.app"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
