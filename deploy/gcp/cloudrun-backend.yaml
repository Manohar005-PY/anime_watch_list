apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kage-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        # Connection Budget & Pool Sizing:
        # Cloud SQL max_connections = 100 (Tier db-custom-1-3840).
        # Dedicated Reserves: 5 system/autovacuum + 10 DBA/monitoring + 10 migrations/cron = 25 reserved.
        # Max Available for Web Service pool = 75 connections baseline.
        # Per container instance: 1 Uvicorn worker * (4 steady-state + 4 overflow) = 8 connections max.
        # Target scale setting: 6 instances -> 6 * 8 = 48 steady peak connections.
        # IMPORTANT: Google Cloud documentation explicitly notes that maxScale can be briefly exceeded
        # during rolling deployments, rapid traffic surges, or zone rebalancing.
        # The 27-connection reserve headroom (75 - 48 = 27 connections, 36% buffer) is specifically
        # designed to absorb temporary burst instances beyond 6 without exhausting Cloud SQL limits.
        # Active connection monitoring with alerting at 80% capacity is mandatory.
        autoscaling.knative.dev/maxScale: "6"
        run.googleapis.com/cloudsql-instances: "${GCP_PROJECT_ID}:${GCP_REGION}:${CLOUD_SQL_INSTANCE}"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: "kage-backend-sa@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
      # Concurrency: set conservatively to 16 (matching ~2x database pool capacity of 8 per container).
      # Prevents request queue saturation and 15s pool timeouts under concurrent database load.
      containerConcurrency: 16
      timeoutSeconds: 300
      containers:
        - image: "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO}/kage-backend:${IMAGE_TAG}"
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: PROJECT_NAME
              value: "KAGE"
            - name: ENVIRONMENT
              value: "production"
            - name: DEBUG
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: KAGE_DATABASE_URL
                  key: latest
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: KAGE_SECRET_KEY
                  key: latest
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: SESSION_COOKIE_SAMESITE
              value: "lax"
            - name: BACKEND_CORS_ORIGINS
              value: "${FRONTEND_ORIGIN}"
            - name: METADATA_PROVIDER
              value: "kitsu"
            - name: SCHEDULER_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: KAGE_SCHEDULER_SECRET_TOKEN
                  key: latest
            - name: EMAIL_PROVIDER
              value: "smtp"
            - name: SMTP_HOST
              value: "${SMTP_HOST}"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              value: "${SMTP_USER}"
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: KAGE_SMTP_PASSWORD
                  key: latest
            - name: SMTP_TLS
              value: "true"
            - name: EMAILS_FROM_EMAIL
              value: "${EMAILS_FROM_EMAIL}"
            - name: EMAILS_FROM_NAME
              value: "KAGE Anime Library"
            - name: FRONTEND_URL
              value: "${FRONTEND_ORIGIN}"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
